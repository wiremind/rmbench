[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmbench"
version = "0.1.0"
description = "Synthetic data generator and benchmark harness for ClickHouse and DuckDB"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "click>=8.1,<9",
    "clickhouse-driver>=0.2.9,<0.3",
    "duckdb>=1.1,<2",
    "duckdb-engine>=0.13,<1",
    "numpy>=2,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
rmbench = "rmbench.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rmbench.generation" = ["data/*.yaml", "data/*.json"]
"rmbench.clickhouse" = ["queries/*.sql"]
"rmbench.duckdb" = ["queries/*.sql"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "UP", "W"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.per-file-ignores]
# one dense line per column reads better than a wrapped call
"src/rmbench/generation/schema.py" = ["E501"]
# DDL strings: wrapping an ORDER BY clause hurts more than it helps
"clickhouse/migrations/versions/*.py" = ["E501"]
